<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="top-header">

        <h1>Shopping App</h1>

    </header>



    <!-- NAVIGATION -->

    <nav class="navbar">

        <a href="#" class="nav-link">
            Home
        </a>

        <a href="#cart" class="nav-link">
            My Cart
            <span id="cart-count">0</span>
        </a>

        <a href="#orders" class="nav-link">
            My Orders
        </a>

        <a href="#settings" class="nav-link">
            Settings
        </a>

        <a href="#profile" class="nav-link">
            Profile
        </a>

        <a href="#" class="nav-link" id="logout">
            Logout
        </a>

    </nav>



    <!-- PRODUCTS -->

    <main>

        <section class="products-section">

            <div
                id="product-container"
                class="product-container"
            >

                <!-- Products will be loaded using JavaScript -->

            </div>

        </section>



        <!-- CART -->

        <section id="cart" class="info-section">

            <h2>My Cart</h2>

            <p id="cart-message">
                Your cart is empty.
            </p>

        </section>



        <!-- ORDERS -->

        <section id="orders" class="info-section">

            <h2>My Orders</h2>

            <p>
                No orders yet.
            </p>

        </section>



        <!-- SETTINGS -->

        <section id="settings" class="info-section">

            <h2>Settings</h2>

            <p>
                Manage your account settings here.
            </p>

        </section>



        <!-- PROFILE -->

        <section id="profile" class="info-section">

            <h2>Profile</h2>

            <p>
                Welcome to your profile.
            </p>

        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Shopping App
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
